app = "longshort-django-mt5"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[processes]
  app = "sh -c 'gunicorn longshort.wsgi:application --bind 0.0.0.0:${PORT} --access-logfile - --error-logfile - --log-level info'"
